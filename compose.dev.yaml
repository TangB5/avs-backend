services:

  api:
    build: .

    container_name: avs-api

    ports:
      - "4000:4000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

  postgres:
    image: postgres:16-alpine

    container_name: avs-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: avs_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: avs-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: